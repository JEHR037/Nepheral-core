# cargo-about: the licence text of every dependency, shipped with the
# binaries in legal/THIRD-PARTY-LICENSES.html. Regenerate before each release:
#
#   cargo about generate about.hbs -o legal/THIRD-PARTY-LICENSES.html
#
# The accepted list is ADR-0018's (see deny.toml).

accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-linux-android",
]

ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
