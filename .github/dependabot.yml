version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Minimum release age: a version is proposed only two days after it was
    # published, so a compromised release has time to be noticed and yanked.
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    # A major version changes behaviour and APIs, so it goes through an RFC
    # and an ADR like any other change. Alerts still report a vulnerability
    # that only a new major version fixes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    commit-message:
      prefix: ci
