name: Feature request
description: Propose a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Changes to the wire protocol, the chain rules or a privacy property
        need an RFC or an ADR before code. See docs/rfcs and docs/adr.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, and why this one.
